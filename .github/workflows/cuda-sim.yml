name: CUDA examples in GPGPU-Sim
on:
  push:
    branches: [main]
    paths: ['examples/**', 'scripts/cuda-sim.sh', '.github/workflows/cuda-sim.yml']
  pull_request:
    paths: ['examples/**', 'scripts/cuda-sim.sh', '.github/workflows/cuda-sim.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gather:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      # Same toolchain image as upstream's CUDA-sample CI. Tag is mutable;
      # provenance.txt records the installed compiler and simulator revision.
      image: ghcr.io/accel-sim/accel-sim-framework:ubuntu-24.04-cuda-12.8-minimal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gpgpu-sim/gpgpu-sim_distribution
          ref: c3eeb6d19016960ab66789efdd8a3200cc30222a
          path: vendor/gpgpu-sim
      - name: Build pinned GPGPU-Sim
        working-directory: vendor/gpgpu-sim
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          cmake --install build
      - name: Compile and check CUDA examples in functional simulation
        shell: bash
        run: bash scripts/cuda-sim.sh
      - name: Preserve logs and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gather-gpgpu-sim
          path: test-results/cuda-sim/
          if-no-files-found: warn
