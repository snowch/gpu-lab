name: CUDA examples in GPGPU-Sim
on:
  push:
    branches: [main]
    paths: ['examples/**', 'src/hello-model.mjs', 'src/cuda-program.mjs', 'scripts/*cuda*', 'tests/test_cuda_output.py', '.dockerignore', 'docker/cuda-sim.Dockerfile', '.github/workflows/cuda-sim.yml']
  pull_request:
    paths: ['examples/**', 'src/hello-model.mjs', 'src/cuda-program.mjs', 'scripts/*cuda*', 'tests/test_cuda_output.py', '.dockerignore', 'docker/cuda-sim.Dockerfile', '.github/workflows/cuda-sim.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gather:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the browser downloads and CPU references
        run: |
          python3 tests/test_cuda_output.py
          node scripts/generate-cuda-cases.mjs
      - name: Build the desktop simulator image
        run: docker build -f docker/cuda-sim.Dockerfile -t gpu-lab-cuda-sim .
      - name: Compile and check CUDA examples in functional simulation
        run: |
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,src=$PWD,dst=/course" \
            gpu-lab-cuda-sim /course/scripts/cuda-sim.sh
      - name: Check the documented desktop command
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/test-results/generated-cuda,dst=/input,readonly" \
            gpu-lab-cuda-sim /input/double.cu '[2,4,6,8,10]' > test-results/cuda-sim/desktop.log 2>&1
      - name: Preserve logs and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gather-gpgpu-sim
          path: |
            test-results/cuda-sim/
            test-results/generated-cuda/
          if-no-files-found: warn
